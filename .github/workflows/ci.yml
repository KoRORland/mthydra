name: CI

# Fast gate: lint + type-check + both test suites. Runs on every push to main
# and on every pull request. The heavy fleet/tunnel integration gate lives in
# integration.yml (manual + nightly) — see doc/release-playbook.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system tools (age, shellcheck)
        # age/age-keygen back ~160 CLI/startup/restore tests; shellcheck backs
        # the install.sh integration test. Without them those tests skip.
        run: sudo apt-get update && sudo apt-get install -y age shellcheck

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e 'mthydra-backup-monitor[dev]'

      - name: Lint (ruff)
        run: make lint

      - name: Type check (mypy)
        run: make typecheck

      - name: Test (controller + backup-monitor)
        run: make test
