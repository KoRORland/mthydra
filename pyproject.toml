[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mthydra"
version = "0.0.10"
description = "Resilient Telegram access controller — EU side"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "APScheduler>=3.11",
    # >=44 clears the pre-42 PKCS12 NULL-deref (CVE-2024-26130) and
    # Bleichenbacher timing (CVE-2023-50782) lines; tested against 48.x.
    "cryptography>=44.0.1",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "moto[s3]>=5",
    # Pinned exact so CI matches local: ruff's ruleset/line-wrapping and mypy's
    # inference both drift across releases and would flip the lint/type gates.
    "hypothesis>=6",
    "ruff==0.15.13",
    "mypy==2.1.0",
]

[project.scripts]
# mthydra-backup-monitor ships in the separate mthydra-backup-monitor wheel (plan §16.1)
mthydra-controller = "mthydra.controller.__main__:main"
mthydra-ops = "mthydra.ops.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Put the repo root on sys.path so cross-module test imports (e.g.
# `from tests.unit...`) resolve under bare `pytest`, not just `python -m pytest`.
pythonpath = ["."]

[tool.coverage.run]
source = [
    "mthydra.controller.backup",
    "mthydra.controller.state",
    "mthydra.controller.restore",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/mthydra/ru_agent/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test code carries conventions production code shouldn't: long literal
# assertions, semicolon-grouped setup, imports after sys.path tweaks,
# best-effort teardown, and deliberately-broad `raises(Exception)` checks.
"tests/**" = ["E501", "E702", "E402", "SIM105", "B017"]

[tool.mypy]
# Gradual adoption: a lenient-but-real baseline that runs clean on src/ today,
# so any newly-introduced type error fails `make typecheck`. Tighten over time
# (e.g. per-module disallow_untyped_defs) as modules gain annotations.
python_version = "3.12"
files = ["src"]
# boto3 / apscheduler / segno ship no type stubs.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
